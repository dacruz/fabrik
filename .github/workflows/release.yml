name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release
        run: make verify

      - name: Determine next version
        id: version
        shell: bash
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          release_label_count=$(jq '[.[] | select(startswith("release:"))] | length' <<< "$LABELS_JSON")
          release_labels=$(jq -r '.[] | select(startswith("release:"))' <<< "$LABELS_JSON")
          if (( release_label_count > 1 )); then
            echo "Apply at most one release:* label, found: $release_labels" >&2
            exit 1
          fi

          release_label=$(jq -r '[.[] | select(startswith("release:"))][0] // "release:patch"' <<< "$LABELS_JSON")
          if [[ "$release_label" == "release:none" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$release_label" in
            release:patch) bump="patch" ;;
            release:minor) bump="minor" ;;
            release:major) bump="major" ;;
            *)
              echo "Unsupported release label: $release_label" >&2
              exit 1
              ;;
          esac

          latest_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)
          if [[ -z "$latest_tag" ]]; then
            version="v0.1.0"
          elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            case "$bump" in
              patch) version="v${major}.${minor}.$((patch + 1))" ;;
              minor) version="v${major}.$((minor + 1)).0" ;;
              major) version="v$((major + 1)).0.0" ;;
            esac
          else
            echo "Latest tag is not a supported semantic version: $latest_tag" >&2
            exit 1
          fi

          next_major="${version#v}"
          next_major="${next_major%%.*}"
          module_path=$(go list -m)
          if (( next_major >= 2 )) && [[ "$module_path" != */v"$next_major" ]]; then
            echo "Module path $module_path must end in /v${next_major} before releasing $version" >&2
            exit 1
          fi

          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Version tag already exists: $version" >&2
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        if: steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" "$MERGE_COMMIT"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --verify-tag --generate-notes
